<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>🏊🚴🏃 Trilo</h1>
    <p class="subtitle">Analyse tes performances triathlon</p>

    <section class="card">
      <h2>Natation</h2>
      <input id="swimDist" type="number" placeholder="Distance en mètres">
      <input id="swimTime" type="text" placeholder="Temps ex : 4:30">

      <h2>Vélo</h2>
      <input id="bikeDist" type="number" placeholder="Distance en kilomètres">
      <input id="bikeTime" type="text" placeholder="Temps ex : 45:30">

      <h2>Course</h2>
      <input id="runDist" type="number" placeholder="Distance en kilomètres">
      <input id="runTime" type="text" placeholder="Temps ex : 20:15">

      <p class="help">Format temps : minutes:secondes. Exemple : 4:30</p>

      <button id="analyzeBtn">Analyser</button>
      <button id="resetBtn" class="reset">Réinitialiser</button>
    </section>

    <section class="result">
      <h2 id="score">Aucun score</h2>
      <p id="message">Entre tes performances puis clique sur Analyser.</p>
    </section>

    <section class="chart-box">
      <canvas id="chart"></canvas>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
